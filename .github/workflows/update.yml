name: update-cn-asn

on:
  schedule:
    - cron: "0 18 * * *" # daily 18:00 UTC; client machines pull the release on their own schedule
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cn-asn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ruleset
        run: |
          python3 gen_cn_asn.py \
            --output cn-asn.json \
            --extra cn-asn-extra.txt \
            --min-ratio 0.8 \
            --concurrency 8

      - name: Validate against currently released ruleset
        run: |
          curl -fsSL --retry 2 -o prev-cn-asn.json \
            https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cn-asn.json \
            || { echo "no previous release (first run), skipping comparison"; exit 0; }
          python3 - <<'EOF'
          import json, sys
          new = json.load(open("cn-asn.json"))
          old = json.load(open("prev-cn-asn.json"))
          nc = sum(len(r.get("ip_cidr", [])) for r in new["rules"])
          oc = sum(len(r.get("ip_cidr", [])) for r in old["rules"])
          print(f"old prefixes: {oc}, new prefixes: {nc}")
          if nc < oc * 0.8:
              sys.exit(f"FATAL: new count {nc} < 80% of released {oc}, refusing to publish")
          if oc and nc > oc * 1.5:
              sys.exit(f"FATAL: new count {nc} jumped >50% over {oc}, suspicious data, refusing to publish")
          EOF

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum cn-asn.json | awk '{print $1}' > cn-asn.json.sha256
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "CN ASN ruleset (rolling latest)" \
              --notes "Auto-built sing-box source ruleset of routed CN ASNs. Stable asset URLs:
          - https://github.com/$GITHUB_REPOSITORY/releases/latest/download/cn-asn.json
          - https://github.com/$GITHUB_REPOSITORY/releases/latest/download/cn-asn.json.sha256"
          gh release upload latest cn-asn.json cn-asn.json.sha256 --repo "$GITHUB_REPOSITORY" --clobber
